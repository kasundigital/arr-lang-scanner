###############################################
# SONARR / RADARR LANGUAGE SCANNER CONFIG
###############################################

[sonarr]
url = http://localhost:7878
api_key = 111111111111111111111

[radarr]
url = http://localhost:8989
api_key = 1111111111111111111111

[auth]
username = admin
password = changeme123
token = sr-lang-token-change-me

[app]
# Bind IP (0.0.0.0 = open to network, 127.0.0.1 = local only)
bind_ip = 0.0.0.0

# Web UI port
port = 8100

# Timeout for API calls
request_timeout = 60

# Log level: info / debug
log_level = info

# Name of the systemd service
service_name = sr-lang-scanner
